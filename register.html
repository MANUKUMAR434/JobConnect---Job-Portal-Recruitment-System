<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobConnect - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.dribbble.com/userupload/5071523/file/original-7a4969626d4fe2948e164673629b4974.gif"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white w-full max-w-lg p-8 rounded-xl shadow-lg">

    <h1 class="text-3xl font-bold text-blue-700 text-center">
        JobConnect
    </h1>

    <h2 class="text-xl font-semibold text-center mt-3">
        Create Your Account
    </h2>

    <p class="text-gray-500 text-center mb-6">
        Register to get started
    </p>

    <form id="registerForm" class="space-y-4">

        <input type="text" placeholder="Full Name"
        class="w-full border p-3 rounded-lg" required>

        <input type="email" placeholder="Email Address"
        class="w-full border p-3 rounded-lg" required>

        <input type="tel" placeholder="Mobile Number"
        class="w-full border p-3 rounded-lg" required>

        <select id="role" class="w-full border p-3 rounded-lg" required>
            <option value="">Select Your Role</option>
            <option value="Job Seeker">Job Seeker</option>
            <option value="Recruiter">Recruiter / HR</option>
        </select>

        <input type="password" id="password"
        placeholder="Create Password"
        class="w-full border p-3 rounded-lg" required>

        <input type="password" id="confirmPassword"
        placeholder="Confirm Password"
        class="w-full border p-3 rounded-lg" required>

        <button type="submit"
        class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700 font-semibold">
            Create Account
        </button>

    </form>

    <p class="text-center mt-5 text-gray-600">
        Already have an account?
        <a href="login.html" class="text-blue-600 font-semibold">
            Login
        </a>
    </p>

    <p class="text-center mt-4 text-sm">
        <a href="index.html" class="text-gray-500">
            Back to Home
        </a>
    </p>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    alert("Registration form submitted successfully!");
});
</script>

</body>
</html>
