
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | JobConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h1 class="text-3xl font-bold text-blue-700 text-center">JobConnect</h1>
    <h2 class="text-2xl font-semibold text-center mt-4">Admin Login</h2>
    <p class="text-gray-500 text-center mt-2 mb-6">Access your administration panel</p>

    <form id="loginForm" class="space-y-4">
        <input id="email" type="email" placeholder="Admin Email"
        class="w-full border p-3 rounded-lg" required>

        <input id="password" type="password" placeholder="Password"
        class="w-full border p-3 rounded-lg" required>

        <label class="flex gap-2 text-gray-600">
            <input type="checkbox" id="showPassword"> Show Password
        </label>

        <button class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700">
            Login
        </button>
    </form>

    <p class="text-center mt-5">
        <a href="index.html" class="text-blue-600">← Back to Home</a>
    </p>
</div>

<script>
document.getElementById("showPassword").onchange = function() {
    document.getElementById("password").type = this.checked ? "text" : "password";
};

document.getElementById("loginForm").onsubmit = function(e) {
    e.preventDefault();

    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;

    if(email === "admin@gmail.com" && password === "Admin123") {
        localStorage.setItem("adminLoggedIn", "true");
        window.location.href = "admin-dashboard.html";
    } else {
        alert("Invalid Admin Email or Password!");
    }
};
</script>
</body>
</html>
